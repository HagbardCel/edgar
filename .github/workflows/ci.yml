name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI must build the actual PR head, not a synthetic merge ref, so
          # evidence provenance checks see the true commit history. Full
          # history is required for source_commit ancestry verification.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (non-network)
        run: uv run pytest -q -m "not network"
      - name: Verify committed spike evidence
        run: uv run python scripts/spikes/verify_evidence.py fixtures/manifests/0001065088-24-000036
