name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgar
          POSTGRES_PASSWORD: edgar
          POSTGRES_DB: edgar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgar -d edgar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (non-network, non-database)
        run: uv run pytest -q -m "not network and not database"
      - name: Pytest (database)
        env:
          EDGAR_TEST_DATABASE_URL: postgresql+psycopg://edgar:edgar@localhost:5432/edgar_test
        run: uv run pytest -q -m "database and not network"
