[project]
name = "edgar"
version = "0.1.0"
description = "Reproducible SEC EDGAR filing and XBRL evidence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.19.0",
    "arelle-release==2.43.1",
    "filelock>=3.13.0",
    "httpx>=0.28.0",
    "lxml>=5.0.0",
    "psycopg[binary]>=3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2",
    "typer>=0.15.0",
]

[project.scripts]
edgar = "edgar.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: live SEC or internet tests (disabled by default)",
    "database: PostgreSQL integration tests (require EDGAR_TEST_DATABASE_URL targeting edgar_test)",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "scripts"]
