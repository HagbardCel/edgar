## Coverage notes

- Continuation chains / duplicate visual facts: confirm during spike and corpus expansion; add a sixth filing if eBay/Walmart/JPM/KO do not cover them.
- Malformed HTML: add a targeted filing if none of the five expose awkward markup.
- Taxonomy transition: desirable later; not required for the initial five.
