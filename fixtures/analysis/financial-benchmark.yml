benchmark_version: 1
contracts:
- contract_ref:
    metric_key: revenue
    definition_hash_scheme: metric-v2
    definition_hash: e71cd599a88a3460002c05eaa14e2aab62d2e13efe531a1ccf18e5e0c6a30f3c
  definition:
    key: revenue
    kind: reported
    statement: income_statement
    period_type: duration
    value_kind: numeric
    unit_dimension: monetary
    definition: Revenue generated from the reporting entity's ordinary activities during the reporting
      period, before operating expenses.
    includes:
    - sales of goods
    - service revenue
    - consolidated ordinary operating revenue
    excludes:
    - gross profit
    - billings
    - bookings
    - gross merchandise value
    - interest income for entities where it is not ordinary operating revenue
    - other operating income
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: existing_key_revision
    related_current_key: revenue
    intended_quantity: Consolidated ordinary operating revenue for the reporting period.
    changed_boundaries: Clarify ordinary operating revenue; exclude interest income where not ordinary
      operating revenue; freeze accounting_basis=us_gaap and sign_convention=reported.
    economic_direction: Positive for ordinary sales/service revenue; negative values are atypical for
      this contract.
    legitimate_negative_example: A rare reported negative revenue adjustment that remains within ordinary
      operating revenue presentation (not a credit memo reclassed as expense).
    incompatible_sign_example: Flipping expense debit balance or calculation weight to force revenue positive.
    stable_key_decision: Retain key; new ContractRef via metric-v2 fields
- contract_ref:
    metric_key: operating_income
    definition_hash_scheme: metric-v2
    definition_hash: 0ddf26f7beb7fb26c93922eb378eb4a5c87353ed29524bfeff1129bccfe5337e
  definition:
    key: operating_income
    kind: reported
    statement: income_statement
    period_type: duration
    value_kind: numeric
    unit_dimension: monetary
    definition: Income from ordinary operations after operating expenses and before non-operating items,
      interest, and income taxes.
    includes:
    - operating income or loss from continuing operations
    - income from operations
    excludes:
    - pretax income
    - net income
    - EBITDA
    - adjusted or non-GAAP operating income
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: existing_key_revision
    related_current_key: operating_income
    intended_quantity: Income from ordinary operations after operating expenses, before interest and taxes.
    changed_boundaries: Exclude adjusted/non-GAAP operating income; freeze basis/sign.
    economic_direction: Positive for operating profit; negative for operating loss.
    legitimate_negative_example: Operating loss year presented as negative OperatingIncomeLoss.
    incompatible_sign_example: Negating a filed operating loss because balance=credit.
    stable_key_decision: Retain key; new ContractRef via metric-v2 fields
- contract_ref:
    metric_key: research_and_development
    definition_hash_scheme: metric-v2
    definition_hash: 526498bba8bdfe2e6af9649595581d95cc036ae3829ee348c7e39dd998fee4e9
  definition:
    key: research_and_development
    kind: reported
    statement: income_statement
    period_type: duration
    value_kind: numeric
    unit_dimension: monetary
    definition: Expense for research and development activities incurred during the reporting period,
      as classified on the income statement.
    includes:
    - research expense
    - development expense
    - combined research and development expense
    excludes:
    - capitalized internally developed software additions
    - selling, general, and administrative expense
    - cost of revenue
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: existing_key_revision
    related_current_key: research_and_development
    intended_quantity: Expense for research and development as classified on the income statement.
    changed_boundaries: Missing R&D disclosure is not zero; freeze basis/sign.
    economic_direction: Expense magnitude is typically positive as filed expense; negative may represent
      a benefit/credit.
    legitimate_negative_example: An R&D credit/benefit reported as a negative expense on the face of the
      income statement.
    incompatible_sign_example: Forcing R&D positive by ignoring a filed credit.
    stable_key_decision: Retain key; new ContractRef via metric-v2 fields
- contract_ref:
    metric_key: net_income_attributable_to_parent
    definition_hash_scheme: metric-v2
    definition_hash: ffcfc02f7b5f1b79a3bfe23f1ae962cc1c433488646b63b86dc9c37d23714b0f
  definition:
    key: net_income_attributable_to_parent
    kind: reported
    statement: income_statement
    period_type: duration
    value_kind: numeric
    unit_dimension: monetary
    definition: Net income or loss attributable to the parent entity's owners, after noncontrolling interests.
    includes:
    - net income attributable to parent shareholders
    - net income attributable to stockholders
    excludes:
    - consolidated net income including noncontrolling interests
    - income available to common shareholders after preferred dividends when that amount is a narrower
      residual
    - comprehensive income attributable to parent
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: existing_key_revision
    related_current_key: net_income_attributable_to_parent
    intended_quantity: Net income or loss attributable to the parent entity owners.
    changed_boundaries: Exclude consolidated NI including NCI when parent-only is available; freeze basis/sign.
    economic_direction: Positive for parent profit; negative for parent loss.
    legitimate_negative_example: Net loss attributable to parent shareholders.
    incompatible_sign_example: Using calculation weight to flip a loss to profit.
    stable_key_decision: Retain key; new ContractRef via metric-v2 fields
- contract_ref:
    metric_key: total_assets
    definition_hash_scheme: metric-v2
    definition_hash: afff7e343482eafeb6f5e9429dfb1059581347f5de241dbc0aae9b7745cec299
  definition:
    key: total_assets
    kind: reported
    statement: balance_sheet
    period_type: instant
    value_kind: numeric
    unit_dimension: monetary
    definition: The sum of all assets reported on the balance sheet at the reporting date.
    includes:
    - total assets
    excludes:
    - current assets only
    - net assets or equity
    - assets under management that are not on-balance-sheet assets
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: existing_key_revision
    related_current_key: total_assets
    intended_quantity: Sum of all assets on the balance sheet at the reporting date.
    changed_boundaries: Instant balance-sheet total only; freeze basis/sign.
    economic_direction: Typically positive; negative totals are exceptional.
    legitimate_negative_example: None expected for a going-concern consolidated total assets line.
    incompatible_sign_example: Treating a credit-balance presentation quirk as negative assets without
      evidence.
    stable_key_decision: Retain key; new ContractRef via metric-v2 fields
- contract_ref:
    metric_key: cash_excluding_restricted_cash
    definition_hash_scheme: metric-v2
    definition_hash: daa38a62d254a752c8342a22162fa8607fe4f294a29da7185f1e3c716768aaf0
  definition:
    key: cash_excluding_restricted_cash
    kind: reported
    statement: balance_sheet
    period_type: instant
    value_kind: numeric
    unit_dimension: monetary
    definition: Cash and highly liquid cash equivalents at the reporting date that exclude restricted
      cash. A combined cash-and-restricted-cash total does not satisfy this contract even when the issuer
      presents no separate unrestricted line.
    includes:
    - cash
    - cash equivalents
    - cash and cash equivalents at carrying value excluding restricted cash
    excludes:
    - restricted cash presented separately or within a combined cash total
    - cash including restricted cash when that combined total is broader
    - short-term investments that are not cash equivalents
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: proposed_new_key
    related_current_key: cash_and_cash_equivalents
    intended_quantity: Unrestricted cash and cash equivalents only.
    changed_boundaries: Distinct from cash_and_cash_equivalents which ambiguously allowed restricted cash
      inside the same line. New co-requestable key.
    economic_direction: Typically positive.
    legitimate_negative_example: None expected for unrestricted cash.
    incompatible_sign_example: Sign-flipping a cash balance from presentation quirks.
    stable_key_decision: New key; distinct co-requestable quantity from related_current_key
- contract_ref:
    metric_key: operating_cash_flow
    definition_hash_scheme: metric-v2
    definition_hash: e5337bf362575b18a2d0b6d036f83ff50de6f728aa2a46fd53a70736119b0b21
  definition:
    key: operating_cash_flow
    kind: reported
    statement: cash_flow
    period_type: duration
    value_kind: numeric
    unit_dimension: monetary
    definition: Net cash provided by or used in operating activities during the reporting period.
    includes:
    - net cash from operating activities
    - cash generated from operations
    excludes:
    - free cash flow
    - investing cash flow
    - financing cash flow
    - adjusted or non-GAAP operating cash flow
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: existing_key_revision
    related_current_key: operating_cash_flow
    intended_quantity: Net cash provided by or used in operating activities.
    changed_boundaries: Exclude free cash flow and non-GAAP OCF; freeze basis/sign.
    economic_direction: Positive for cash provided; negative for cash used.
    legitimate_negative_example: Net cash used in operating activities.
    incompatible_sign_example: Flipping OCF sign from calculation arc weight.
    stable_key_decision: Retain key; new ContractRef via metric-v2 fields
- contract_ref:
    metric_key: cash_purchases_of_ppe
    definition_hash_scheme: metric-v2
    definition_hash: 739e6c3490a3baeff9af9c211cd0e26f070b00b77f91c3413dcdba3186aa05ab
  definition:
    key: cash_purchases_of_ppe
    kind: reported
    statement: cash_flow
    period_type: duration
    value_kind: numeric
    unit_dimension: monetary
    definition: Cash paid to acquire property, plant, and equipment during the reporting period, as reported
      in investing cash flows. Broader capital-expenditure aggregates that mix PP&E with other productive
      assets do not satisfy this contract without explicit review that they are PP&E-only.
    includes:
    - purchases of property, plant and equipment
    - cash payments to acquire PP&E
    excludes:
    - depreciation and amortization
    - business acquisitions
    - purchases of marketable securities
    - capitalized software presented separately from PP&E purchases
    - broad capital expenditure totals that include non-PP&E productive assets
    accounting_basis: us_gaap
    sign_convention: reported
  m0_review:
    registry_state: proposed_new_key
    related_current_key: capital_expenditure
    intended_quantity: Cash purchases of PP&E only.
    changed_boundaries: Narrower successor to capital_expenditure focusing on cash PP&E purchases.
    economic_direction: Typically positive outflow magnitude as filed (or negative per issuer sign convention
      for investing outflows); preserve filed sign.
    legitimate_negative_example: Issuer presents PP&E purchases as a negative investing outflow.
    incompatible_sign_example: Forcing PP&E purchases positive by ignoring filed investing sign.
    stable_key_decision: New key; distinct co-requestable quantity from related_current_key
